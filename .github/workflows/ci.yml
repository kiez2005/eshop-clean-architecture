name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CleanArchitecture.sln

      - name: Build solution
        run: dotnet build CleanArchitecture.sln --configuration Release --no-restore

      - name: Run Unit & Architecture Tests
        run: dotnet test CleanArchitecture.sln --configuration Release --no-build --verbosity normal
